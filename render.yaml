services:
  - type: web
    name: steward-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.4
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: STEWARD_MODE
        value: simulation
      - key: ALLOW_MAINNET_EXECUTION
        value: "false"
      - key: NEAR_AI_BASE_URL
        value: https://cloud-api.near.ai/v1
      - key: NEAR_AI_MODEL
        value: Qwen/Qwen3.6-35B-A3B-FP8
      - key: ONECLICK_API_BASE_URL
        value: https://1click.chaindefuser.com
      - key: NEAR_RPC_MAINNET_URL
        value: https://rpc.mainnet.near.org
      - key: NEAR_AI_API_KEY
        sync: false
      - key: ONECLICK_API_KEY
        sync: false
